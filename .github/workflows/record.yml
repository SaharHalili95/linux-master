name: Record disk output

# Records a list on a real Ubuntu VM. Push a branch named record/<name> to run tests/sandbox/record/<name>.txt
# (or record/vm.txt if no such file), then merge the artifact locally with:
# node tests/sandbox/record-merge.js "Ubuntu 24.04" <folder> [recorded/pN.js]
on:
  push:
    branches: ['record/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          name=${GITHUB_REF_NAME#record/}
          list=record/$name.txt; [ -f tests/sandbox/$list ] || list=record/vm.txt
          bash tests/sandbox/record-vm.sh /tmp/rec $list
      - uses: actions/upload-artifact@v4
        with:
          name: recordings
          path: /tmp/rec
