name: Publish GitHub Pages

# Deploys only a commit whose Tests workflow passed.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir _site
          cp index.html legal.html styles.css character.css avatar-options.css gameplay.css loading.css fonts.css shell.js app.js character.js world-characters.js character-art.js avatar-options.js game-progress.js story-missions.js course-start.js course-ready.js sync.js coach-model.js coach-bank.js world.js i18n.js units.js lessons.js recorded.js manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png og.jpg _site/
          cp -r data fonts character-art recorded parts classic prototype _site/
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
